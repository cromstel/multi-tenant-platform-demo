# CI for CITGROUP TENANCY SYSTEM
#
# Runs on every push and pull request:
#  1. verify  — typecheck, lint, test suite (against a MySQL 8 service
#     container), production build
#  2. docker  — builds the Docker image and runs a smoke test
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm is pinned by packageManager; corepack activates that exact version.
  PNPM_VERSION: 10.12.4
  # Test database credentials (CI-only values).
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: multi_tenant_admin
  MYSQL_PASSWORD: ci_dev_password
  MYSQL_DATABASE: multi_tenant
  NEXT_PUBLIC_ROOT_DOMAIN: localhost:3030
  ADMIN_PATH: ops-ci
  ADMIN_EMAIL: admin@ci.local
  ADMIN_PASSWORD: admin_ci_password
  ADMIN_SESSION_SECRET: ci_admin_session_secret_do_not_use_in_production
  AUTH_JWT_SECRET: ci_auth_jwt_secret_do_not_use_in_production
  TENANT_SESSION_SECRET: ci_tenant_session_secret_do_not_use_in_production

jobs:
  ############################################################################
  # verify — typecheck → lint → test → build
  ############################################################################
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_dev_only
          MYSQL_DATABASE: multi_tenant
          MYSQL_USER: multi_tenant_admin
          MYSQL_PASSWORD: ci_dev_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -p\$\$MYSQL_ROOT_PASSWORD"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack and pin pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc --noEmit)
        run: pnpm typecheck

      - name: Lint (eslint)
        run: pnpm lint

      - name: Test suite against MySQL
        env:
          MYSQL_HOST: ${{ env.MYSQL_HOST }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          NEXT_PUBLIC_ROOT_DOMAIN: ${{ env.NEXT_PUBLIC_ROOT_DOMAIN }}
          ADMIN_PATH: ${{ env.ADMIN_PATH }}
          ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ env.ADMIN_SESSION_SECRET }}
          AUTH_JWT_SECRET: ${{ env.AUTH_JWT_SECRET }}
          TENANT_SESSION_SECRET: ${{ env.TENANT_SESSION_SECRET }}
        run: pnpm test

      - name: Production build
        env:
          NEXT_PUBLIC_ROOT_DOMAIN: ${{ env.NEXT_PUBLIC_ROOT_DOMAIN }}
        run: pnpm build

  ############################################################################
  # docker — build image and run smoke test
  ############################################################################
  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_ROOT_DOMAIN=${{ env.NEXT_PUBLIC_ROOT_DOMAIN }} \
            -t citgroup-tenancy-system:ci .

      - name: Start container for smoke test
        id: container
        run: |
          CID=$(docker run -d \
            -e NODE_ENV=production \
            -e PORT=3030 \
            -e HOSTNAME=0.0.0.0 \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_PORT=3306 \
            -e MYSQL_USER=${{ env.MYSQL_USER }} \
            -e MYSQL_PASSWORD=${{ env.MYSQL_PASSWORD }} \
            -e MYSQL_DATABASE=${{ env.MYSQL_DATABASE }} \
            -e NEXT_PUBLIC_ROOT_DOMAIN=${{ env.NEXT_PUBLIC_ROOT_DOMAIN }} \
            -e ADMIN_PATH=${{ env.ADMIN_PATH }} \
            -e ADMIN_EMAIL=${{ env.ADMIN_EMAIL }} \
            -e ADMIN_PASSWORD=${{ env.ADMIN_PASSWORD }} \
            -e ADMIN_SESSION_SECRET=${{ env.ADMIN_SESSION_SECRET }} \
            -e AUTH_JWT_SECRET=${{ env.AUTH_JWT_SECRET }} \
            -e TENANT_SESSION_SECRET=${{ env.TENANT_SESSION_SECRET }} \
            -p 127.0.0.1:3030:3030 \
            citgroup-tenancy-system:ci)
          echo "cid=$CID" >> $GITHUB_OUTPUT

      - name: Wait for container to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3030/api/health > /dev/null; then
              echo "Container is ready"
              exit 0
            fi
            echo "Waiting for container... ($i/30)"
            sleep 2
          done
          echo "Container failed to become ready" >&2
          docker logs ${{ steps.container.outputs.cid }} || true
          exit 1

      - name: Smoke test health endpoint
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3030/api/health)
          test "$STATUS" = "200"

      - name: Smoke test landing page
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3030/)
          test "$STATUS" = "200"

      - name: Smoke test auth page
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3030/auth/login)
          test "$STATUS" = "200"

      - name: Stop container
        if: always()
        run: |
          docker stop ${{ steps.container.outputs.cid }} > /dev/null 2>&1 || true
          docker rm ${{ steps.container.outputs.cid }} > /dev/null 2>&1 || true
