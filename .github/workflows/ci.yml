name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push cancels the previous run — no point testing the same commit twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test_only
          MYSQL_DATABASE: multi_tenant
          MYSQL_USER: multi_tenant_admin
          MYSQL_PASSWORD: April--2024!!!!
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_test_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: multi_tenant_admin
          MYSQL_PASSWORD: April--2024!!!!
          MYSQL_DATABASE: multi_tenant
          NEXT_PUBLIC_ROOT_DOMAIN: localhost:3030
          ADMIN_SESSION_SECRET: ci-only-admin-session-secret-32-characters-min
          ADMIN_EMAIL: admin@ci.local
          ADMIN_PASSWORD: ci-only-admin-password

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: citgroup-tenancy-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name app -p 3030:3030 \
            -e ADMIN_SESSION_SECRET=ci-only-admin-session-secret-32-characters-min \
            -e ADMIN_EMAIL=admin@ci.local \
            -e ADMIN_PASSWORD=ci-only-admin-password \
            citgroup-tenancy-system:ci
          sleep 15
          # The health endpoint reports the database as unreachable here — the
          # app still has to boot and answer, so only the shape is checked.
          curl -sf http://127.0.0.1:3030/api/health | grep -q '"service"'
          docker rm -f app
